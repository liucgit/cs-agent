<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能客服小智（本地测试）</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; color: #1f2937; }
        h1 { font-size: 20px; }
        .chat { border: 1px solid #e5e7eb; border-radius: 10px; height: 460px; overflow-y: auto; padding: 14px; background: #fafafa; }
        .msg { margin: 8px 0; padding: 10px 12px; border-radius: 10px; max-width: 85%; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
        .user { background: #2563eb; color: #fff; margin-left: auto; }
        .bot { background: #fff; border: 1px solid #e5e7eb; }
        .row { display: flex; gap: 8px; margin-top: 12px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
        button { padding: 10px 20px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
        button.ghost { background: #94a3b8; }
        .hint { color: #6b7280; font-size: 12px; margin: 8px 0; }
        a { color: #2563eb; }
    </style>
</head>
<body>
<h1>🤖 智能客服"小智"（Agent 本地测试页）</h1>
<div class="hint">
    会话 ID: <span id="sid"></span>（每人独立记忆，重启后仍在 ·
    <a href="/h2-console" target="_blank">H2 控制台(查工单表)</a> ·
    <a href="/api/chat/sessions" target="_blank">全部会话</a>）
</div>
<div id="chat" class="chat"></div>
<div class="row">
    <input id="input" placeholder="试试：帮我查一下我报的打印机工单，顺便问下报销几天内要提交？">
    <button onclick="send()">发送</button>
    <button class="ghost" onclick="clearSession()">清空会话</button>
</div>
<div class="hint">测试账号提示：E1001 张伟 / E1002 李娜 / E1003 王强（可直接说"查 E1003 的工单"）。首次回复约 10~60 秒（含工具调用）。</div>

<script>
    // 简易多会话：每个浏览器标签页一个 sessionId（存 sessionStorage）
    let sid = sessionStorage.getItem('cs_session');
    if (!sid) {
        sid = 'web-' + Math.random().toString(36).slice(2, 10);
        sessionStorage.setItem('cs_session', sid);
    }
    document.getElementById('sid').textContent = sid;
    const chat = document.getElementById('chat');

    function add(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
        const input = document.getElementById('input');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        add('user', text);
        const waiting = add('bot', '小智思考中…（可能正在调用工具，请稍候）');
        try {
            const resp = await fetch('/api/chat', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({sessionId: sid, message: text})
            });
            const data = await resp.json();
            waiting.textContent = data.reply || ('❌ ' + (data.error || '未知错误'));
        } catch (e) {
            waiting.textContent = '❌ 请求失败: ' + e.message;
        }
    }

    async function clearSession() {
        await fetch('/api/chat/' + sid, {method: 'DELETE'});
        chat.innerHTML = '';
        add('bot', '会话已清空，记忆已删除。');
    }

    document.getElementById('input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    add('bot', '你好，我是智能客服小智。可以问我公司制度问题（查知识库），也可以让我查/建工单。');
</script>
</body>
</html>
